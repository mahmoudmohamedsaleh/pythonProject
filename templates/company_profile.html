{% extends 'base.html' %}
{% block title %}Company Profile - EJTech{% endblock %}

{% block content %}
<style>
    .profile-header {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        color: white;
        padding: 25px 30px;
        border-radius: 16px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .profile-header .header-left {
        display: flex;
        align-items: center;
    }
    .profile-header .company-logo {
        max-height: 50px;
        margin-right: 20px;
    }
    .profile-header h1 {
        font-size: 1.8rem;
        font-weight: 700;
        margin: 0;
    }
    .profile-header .tagline {
        font-size: 0.95rem;
        opacity: 0.85;
        margin-top: 5px;
    }
    .profile-header .visit-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 25px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
    }
    .profile-header .visit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        color: white;
        text-decoration: none;
    }
    .profile-header .visit-btn i {
        margin-right: 8px;
    }
    
    .website-container {
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 25px rgba(0,0,0,0.1);
        overflow: hidden;
        margin-bottom: 20px;
    }
    .website-toolbar {
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        padding: 12px 20px;
        border-bottom: 1px solid #dee2e6;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .browser-dots {
        display: flex;
        gap: 8px;
    }
    .browser-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
    }
    .browser-dot.red { background: #ff5f57; }
    .browser-dot.yellow { background: #febc2e; }
    .browser-dot.green { background: #28c840; }
    .url-bar {
        background: white;
        border: 1px solid #dee2e6;
        border-radius: 20px;
        padding: 8px 20px;
        font-size: 0.9rem;
        color: #495057;
        flex: 1;
        margin: 0 20px;
        display: flex;
        align-items: center;
    }
    .url-bar i {
        color: #28a745;
        margin-right: 10px;
    }
    .toolbar-actions {
        display: flex;
        gap: 10px;
    }
    .toolbar-actions .btn {
        padding: 6px 15px;
        font-size: 0.85rem;
        border-radius: 20px;
    }
    
    .website-frame {
        width: 100%;
        height: calc(100vh - 280px);
        min-height: 600px;
        border: none;
    }
    
    .quick-nav {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }
    .quick-nav-btn {
        background: white;
        border: 1px solid #dee2e6;
        padding: 10px 20px;
        border-radius: 25px;
        color: #495057;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
    }
    .quick-nav-btn:hover {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-color: transparent;
        text-decoration: none;
    }
    .quick-nav-btn i {
        margin-right: 8px;
    }
    .quick-nav-btn.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-color: transparent;
    }
</style>

<!-- Header Section -->
<div class="profile-header">
    <div class="header-left">
        <img src="{{ url_for('static', filename='ejt.png') }}" alt="EJTech Logo" class="company-logo">
        <div>
            <h1><i class="fas fa-building mr-2"></i>Company Profile</h1>
            <p class="tagline">Where Professionalism Meets Expertise</p>
        </div>
    </div>
    <a href="https://ejt.sa/" target="_blank" class="visit-btn">
        <i class="fas fa-external-link-alt"></i> Visit Full Website
    </a>
</div>

<!-- Quick Navigation -->
<div class="quick-nav">
    <a href="#" class="quick-nav-btn active" onclick="navigateTo('https://ejt.sa/'); return false;">
        <i class="fas fa-home"></i> Home
    </a>
    <a href="#" class="quick-nav-btn" onclick="navigateTo('https://ejt.sa/#about'); return false;">
        <i class="fas fa-info-circle"></i> About
    </a>
    <a href="#" class="quick-nav-btn" onclick="navigateTo('https://ejt.sa/#clients'); return false;">
        <i class="fas fa-users"></i> Clients
    </a>
    <a href="#" class="quick-nav-btn" onclick="navigateTo('https://ejt.sa/#partners'); return false;">
        <i class="fas fa-handshake"></i> Partners
    </a>
    <a href="#" class="quick-nav-btn" onclick="navigateTo('https://ejt.sa/#projects'); return false;">
        <i class="fas fa-briefcase"></i> Projects
    </a>
</div>

<!-- Website Container -->
<div class="website-container">
    <div class="website-toolbar">
        <div class="browser-dots">
            <span class="browser-dot red"></span>
            <span class="browser-dot yellow"></span>
            <span class="browser-dot green"></span>
        </div>
        <div class="url-bar">
            <i class="fas fa-lock"></i>
            <span id="currentUrl">https://ejt.sa/</span>
        </div>
        <div class="toolbar-actions">
            <button class="btn btn-outline-secondary btn-sm" onclick="refreshFrame()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
            <a href="https://ejt.sa/" target="_blank" class="btn btn-primary btn-sm">
                <i class="fas fa-external-link-alt"></i> Open in New Tab
            </a>
        </div>
    </div>
    <iframe id="websiteFrame" src="https://ejt.sa/" class="website-frame" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" loading="lazy"></iframe>
</div>

<script>
function navigateTo(url) {
    document.getElementById('websiteFrame').src = url;
    document.getElementById('currentUrl').textContent = url;
    
    document.querySelectorAll('.quick-nav-btn').forEach(btn => btn.classList.remove('active'));
    event.target.closest('.quick-nav-btn').classList.add('active');
}

function refreshFrame() {
    const frame = document.getElementById('websiteFrame');
    frame.src = frame.src;
}
</script>

{% endblock %}
