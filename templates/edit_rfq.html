{% extends 'base.html' %}
{% block title %}Edit RFQ{% endblock %}

{% block content %}
<style>
    .card { border: none; border-radius: 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07); }
    .card-header { background-color: #ffffff; border-bottom: 1px solid #e9ecef; font-weight: 600; font-size: 1.25rem; padding: 1.5rem; }
    .card-body { padding: 2rem; }
    .form-control:disabled { background-color: #e9ecef; }
    
    .system-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 0.75rem;
    }
    .system-checkbox-item {
        background: white;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        padding: 0.75rem 1rem;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .system-checkbox-item:hover {
        border-color: #667eea;
        background: #f7f8fc;
    }
    .system-checkbox-item.checked {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-color: transparent;
        color: white;
    }
    .system-checkbox-item input {
        display: none;
    }
    .system-checkbox-item i {
        font-size: 0.9rem;
    }
    .system-checkbox-item span {
        font-size: 0.9rem;
        font-weight: 500;
    }
    .add-system-input {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
    }
    .add-system-input input {
        flex: 1;
    }
    .add-system-input .btn {
        white-space: nowrap;
    }
</style>

<div class="container" style="max-width: 900px;">
    <div class="card">
        <div class="card-header"><i class="fas fa-edit mr-2"></i>Edit Request for Quotation</div>
        <div class="card-body">
            <form method="POST">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="rfq_reference">RFQ Reference</label>
                        <input type="text" class="form-control" id="rfq_reference" value="{{ rfq['rfq_reference'] }}" disabled>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="requested_time">Requested Time</label>
                        <input type="text" class="form-control" id="requested_time" value="{{ rfq['requested_time'] }}" disabled>
                    </div>
                </div>

                <hr class="my-4">

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="project_name">Project Name</label>
                        <select class="form-control" id="project_name" name="project_name" required>
                            {% for project in projects %}
                                <option value="{{ project.project_name }}" {% if project.project_name == rfq['project_name'] %}selected{% endif %}>{{ project.project_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="project_status">Project Status</label>
                        <select class="form-control" id="project_status" name="project_status" required>
                            <option value="On hand" {% if rfq['project_status'] == 'On hand' %}selected{% endif %}>On hand</option>
                            <option value="Tender" {% if rfq['project_status'] == 'Tender' %}selected{% endif %}>Tender</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-3">
                        <label for="priority">Priority</label>
                        <select class="form-control" id="priority" name="priority" required>
                            {% for option in priority_options %}
                                <option value="{{ option }}" {% if option == rfq['priority'] %}selected{% endif %}>{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group col-md-6">
                        <label><i class="fas fa-layer-group mr-1" style="color: #667eea;"></i>System(s)</label>
                        {% set selected_systems = rfq['system'].split(', ') if rfq['system'] else [] %}
                        <div class="system-grid" id="systemGrid">
                            <label class="system-checkbox-item {% if 'CCTV' in selected_systems %}checked{% endif %}">
                                <input class="system-checkbox" type="checkbox" value="CCTV" {% if 'CCTV' in selected_systems %}checked{% endif %}>
                                <i class="fas fa-video"></i>
                                <span>CCTV</span>
                            </label>
                            <label class="system-checkbox-item {% if 'Fire Alarm' in selected_systems %}checked{% endif %}">
                                <input class="system-checkbox" type="checkbox" value="Fire Alarm" {% if 'Fire Alarm' in selected_systems %}checked{% endif %}>
                                <i class="fas fa-fire-extinguisher"></i>
                                <span>Fire Alarm</span>
                            </label>
                            <label class="system-checkbox-item {% if 'Passive' in selected_systems %}checked{% endif %}">
                                <input class="system-checkbox" type="checkbox" value="Passive" {% if 'Passive' in selected_systems %}checked{% endif %}>
                                <i class="fas fa-ethernet"></i>
                                <span>Passive</span>
                            </label>
                            <label class="system-checkbox-item {% if 'Access Control' in selected_systems %}checked{% endif %}">
                                <input class="system-checkbox" type="checkbox" value="Access Control" {% if 'Access Control' in selected_systems %}checked{% endif %}>
                                <i class="fas fa-id-card"></i>
                                <span>Access Control</span>
                            </label>
                            <label class="system-checkbox-item {% if 'MATV' in selected_systems %}checked{% endif %}">
                                <input class="system-checkbox" type="checkbox" value="MATV" {% if 'MATV' in selected_systems %}checked{% endif %}>
                                <i class="fas fa-tv"></i>
                                <span>MATV</span>
                            </label>
                            <label class="system-checkbox-item {% if 'Intercom' in selected_systems %}checked{% endif %}">
                                <input class="system-checkbox" type="checkbox" value="Intercom" {% if 'Intercom' in selected_systems %}checked{% endif %}>
                                <i class="fas fa-phone-alt"></i>
                                <span>Intercom</span>
                            </label>
                            <label class="system-checkbox-item {% if 'BMS' in selected_systems %}checked{% endif %}">
                                <input class="system-checkbox" type="checkbox" value="BMS" {% if 'BMS' in selected_systems %}checked{% endif %}>
                                <i class="fas fa-building"></i>
                                <span>BMS</span>
                            </label>
                            <label class="system-checkbox-item {% if 'PA System' in selected_systems %}checked{% endif %}">
                                <input class="system-checkbox" type="checkbox" value="PA System" {% if 'PA System' in selected_systems %}checked{% endif %}>
                                <i class="fas fa-bullhorn"></i>
                                <span>PA System</span>
                            </label>
                        </div>
                        <div class="add-system-input">
                            <input type="text" class="form-control" id="custom_system" placeholder="Add custom system...">
                            <button class="btn btn-outline-primary" type="button" id="add_custom_system"><i class="fas fa-plus"></i> Add</button>
                        </div>
                        <input type="hidden" id="system" name="system" value="{{ rfq['system'] or '' }}">
                    </div>
                    <div class="form-group col-md-3">
                        <label for="deadline">Deadline</label>
                        <input type="date" class="form-control" id="deadline" name="deadline" value="{{ rfq['deadline'] }}" required>
                    </div>
                </div>

                <hr class="my-4">

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="sales_engineer_presale">Pre-Sales Engineer</label>
                        <select class="form-control" id="sales_engineer_presale" name="sales_engineer_presale" required>
                            {% for engineer in presale_engineers %}
                                <option value="{{ engineer.username }}" {% if engineer.username == rfq['sales_engineer_presale'] %}selected{% endif %}>{{ engineer.username }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="sales_engineer_sales">Sales Engineer</label>
                        <select class="form-control" id="sales_engineer_sales" name="sales_engineer_sales" required>
                            {% for engineer in sales_engineers %}
                                <option value="{{ engineer.username }}" {% if engineer.username == rfq['sales_engineer_sales'] %}selected{% endif %}>{{ engineer.username }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="rfq_status">RFQ Status</label>
                        <select class="form-control" id="rfq_status" name="rfq_status" required>
                            {% for option in rfq_status_options %}
                                <option value="{{ option }}" {% if option == rfq['rfq_status'] %}selected{% endif %}>{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="quotation_status">Quotation Status</label>
                        <select class="form-control" id="quotation_status" name="quotation_status" required>
                            {% for option in quotation_status_options %}
                                <option value="{{ option }}" {% if option == rfq['quotation_status'] %}selected{% endif %}>{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="note">Note</label>
                    <textarea class="form-control" id="note" name="note" rows="4">{{ rfq['note'] if rfq['note'] is not none else '' }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary"><i class="fas fa-save mr-2"></i>Update RFQ</button>
                <a href="{{ url_for('rfq_summary') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const systemGrid = document.getElementById('systemGrid');
    const hiddenInput = document.getElementById('system');
    const customInput = document.getElementById('custom_system');
    const addBtn = document.getElementById('add_custom_system');
    
    function updateHiddenInput() {
        const checked = document.querySelectorAll('.system-checkbox:checked');
        const values = Array.from(checked).map(cb => cb.value);
        hiddenInput.value = values.join(', ');
    }
    
    document.querySelectorAll('.system-checkbox-item').forEach(item => {
        item.addEventListener('click', function(e) {
            if (e.target.tagName !== 'INPUT') {
                const checkbox = this.querySelector('input');
                checkbox.checked = !checkbox.checked;
            }
            this.classList.toggle('checked', this.querySelector('input').checked);
            updateHiddenInput();
        });
        
        const checkbox = item.querySelector('input');
        checkbox.addEventListener('change', function() {
            item.classList.toggle('checked', this.checked);
            updateHiddenInput();
        });
    });
    
    addBtn.addEventListener('click', function() {
        const customValue = customInput.value.trim();
        if (customValue && !document.querySelector(`.system-checkbox[value="${customValue}"]`)) {
            const newItem = document.createElement('label');
            newItem.className = 'system-checkbox-item checked';
            newItem.innerHTML = `
                <input class="system-checkbox" type="checkbox" value="${customValue}" checked>
                <i class="fas fa-plus-circle"></i>
                <span>${customValue}</span>
            `;
            systemGrid.appendChild(newItem);
            
            newItem.addEventListener('click', function(e) {
                if (e.target.tagName !== 'INPUT') {
                    const checkbox = this.querySelector('input');
                    checkbox.checked = !checkbox.checked;
                }
                this.classList.toggle('checked', this.querySelector('input').checked);
                updateHiddenInput();
            });
            
            customInput.value = '';
            updateHiddenInput();
        }
    });
    
    customInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            addBtn.click();
        }
    });
    
    updateHiddenInput();
});
</script>
{% endblock %}
